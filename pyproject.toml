[project]
name = "ableton-ai-control-bridge"
version = "0.7.0"
description = "Local HTTP-to-UDP bridge for controlling Ableton Live from AI-generated commands."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ableton-bridge = "ableton_bridge.gui_server:main"
ableton-bridge-desktop = "ableton_bridge.autostart:main"
ableton-bridge-send = "ableton_bridge.cli:main"
ableton-bridge-run = "ableton_bridge.runner:main"
ableton-bridge-check = "ableton_bridge.preflight:main"
darksco-compile = "darksco.cli:main"
darksco-library = "darksco.sound_library:main"
darksco-discover = "darksco.catalog_scraper:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ableton_bridge*", "darksco*"]
exclude = ["tests*", "examples*", "docs*", "remote-scripts*", "windows*"]
