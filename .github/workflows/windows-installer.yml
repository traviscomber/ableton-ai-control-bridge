name: Build Windows installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ableton_bridge/**"
      - "max-for-live/**"
      - "remote-scripts/**"
      - "windows/**"
      - "pyproject.toml"
      - ".github/workflows/windows-installer.yml"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        shell: powershell
        run: |
          python -m pip install --upgrade pyinstaller pytest
          choco install innosetup --no-progress -y
      - name: Run tests
        run: python -m pytest -q
      - name: Build installer
        shell: powershell
        run: .\windows\build-installer.ps1 -Python python -OutputDirectory dist-installer
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ableton-AI-Control-Bridge-Windows
          path: dist-installer/*.exe
      - name: Attach installer to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installer/*.exe
